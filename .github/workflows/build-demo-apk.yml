name: Build Minecraft Rust Demo APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'demo/**'
      - '.github/workflows/build-demo-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build demo APK
        working-directory: demo
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Rust-Launcher-Alpha-0.1-Teste-1-APK
          path: demo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
