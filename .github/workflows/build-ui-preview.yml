name: Build Minecraft Rust UI Preview APK

on:
  push:
    branches: [launcher-ui-preview]
    paths:
      - 'demo-apk/**'
      - '.github/workflows/build-ui-preview.yml'

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1); fi
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build preview APK
        working-directory: demo-apk
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: |
          mkdir -p dist
          cp demo-apk/app/build/outputs/apk/debug/app-debug.apk dist/Minecraft-Rust-Launcher-Preview-Alpha-0.1-Teste-1.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Rust-Launcher-Preview-Alpha-0.1-Teste-1
          path: dist/*
          retention-days: 14
